<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商业化写作方法论知识库</title>
  <meta name="description" content="漫剧 / 短剧 / 网文 / 短篇写作方法论蒸馏库" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #1f6feb;
    }
    .sidebar-nav > ul > li > p strong {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    window.$docsify = {
      name: '写作方法论知识库',
      repo: 'VanGong1999/ai-commerical-writing-knowledgebase',
      loadSidebar: true,
      auto2top: true,
      relativePath: true,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索知识库',
        noData: '没有结果',
        depth: 3
      },
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      homepage: 'README.md'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
